[package]
name = "fakelinux"
version = "0.1.0"
edition = "2021"
exclude = ["alpine-rootfs", "sysroot", "busybox", "hello_*", "test_*", "docs"]

[dependencies]
libc = "0.2"
disarm64 = "0.1"
disarm64_defn = "0.1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde_json = "1"
flate2 = "1"
tar = "0.4"

[build-dependencies]
roxmltree = "0.20"
